name: traffic

# GitHub's traffic API only exposes the last 14 days. Snapshot it daily so the
# history accumulates instead of rolling off.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch traffic
        env:
          # The default GITHUB_TOKEN CANNOT read traffic (403) -- those
          # endpoints need Administration:read, which Actions does not grant.
          # A PAT is required. See the error message below for setup.
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::TRAFFIC_TOKEN secret is not set."
            echo ""
            echo "GitHub's traffic API needs Administration:read, which the"
            echo "default GITHUB_TOKEN does not have. To enable this workflow:"
            echo ""
            echo "  1. https://github.com/settings/personal-access-tokens/new"
            echo "  2. Repository access -> Only select repositories -> this one"
            echo "  3. Repository permissions -> Administration -> Read-only"
            echo "  4. gh secret set TRAFFIC_TOKEN --body '<the token>'"
            echo ""
            echo "Until then, run ./dev/traffic.sh locally -- your own gh login"
            echo "already has the scope."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/traffic/clones" > /tmp/clones.json
          gh api "repos/${{ github.repository }}/traffic/views"  > /tmp/views.json

      - name: Merge into history
        run: python3 .github/merge_traffic.py

      - name: Commit
        run: |
          git config user.name  "traffic-bot"
          git config user.email "traffic-bot@users.noreply.github.com"
          git add .traffic/history.json
          git diff --staged --quiet || git commit -m "traffic: $(date -u +%Y-%m-%d)"
          git push
