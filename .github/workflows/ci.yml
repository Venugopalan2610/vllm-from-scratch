name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  cpu-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install uv
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install transformers==5.14.1 accelerate==1.14.0 safetensors==0.8.0 \
            numpy==2.5.1 pytest==9.1.1 pytest-timeout==2.4.0 pytest-asyncio==1.4.0 \
            pyyaml==6.0.3 rich==15.0.0 huggingface_hub==1.26.0 \
            fastapi uvicorn httpx sse-starlette prometheus-client
      - name: Fetch solutions
        run: |
          git fetch origin solutions:refs/remotes/origin/solutions || true
          for f in $(git show origin/solutions:.solutions/ 2>/dev/null | grep '\.py$'); do
            mkdir -p .solutions
            git show origin/solutions:.solutions/$f > .solutions/$f
          done
          cp .solutions/s06_blocks.py app/s06_blocks.py
          cp .solutions/s09_prefix.py app/s09_prefix.py
          cp .solutions/s10_scheduler.py app/s10_scheduler.py
          cp .solutions/s11_chunked.py app/s11_chunked.py
          cp .solutions/s13_sampler.py app/s13_sampler.py
          cp .solutions/s14_detokenizer.py app/s14_detokenizer.py
          cp .solutions/s15_server.py app/s15_server.py
          cp .solutions/s16_metrics.py app/s16_metrics.py
          cp .solutions/s17_speculative.py app/s17_speculative.py
          cp .solutions/s19_guided.py app/s19_guided.py
          cp .solutions/s20_tensor_parallel.py app/s20_tensor_parallel.py
      - name: Run pure-logic stages
        run: |
          source .venv/bin/activate
          python -m pytest tests/stage_06_block_allocator \
                           tests/stage_09_prefix_sharing \
                           tests/stage_10_admission_preemption \
                           tests/stage_11_chunked_prefill \
                           tests/stage_13_sampling \
                           tests/stage_14_detokenization \
                           tests/stage_16_observability \
                           tests/stage_17_speculative_decoding \
                           tests/stage_19_guided_decoding \
                           tests/stage_20_tensor_parallel \
                           -q --timeout=120 --backend torch
      - name: Run harness tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/test_harness.py tests/test_momentum.py -q --timeout=60
