# The ladder. Each stage is a testable milestone that makes the previous one faster
# or more correct. Stages are ordered the way vLLM's ideas were actually discovered.
#
# difficulty: how hard the code is, 1-5
# insight:    the one thing you should walk away understanding

arcs:
  - id: A0
    name: "The Naive Loop"
    blurb: "Build the slow thing first, and measure it, so every later win is a number."
    stages:
      - id: "01-forward-pass"
        file: "app/s01_naive.py"
        name: "Greedy decode, no cache"
        difficulty: 1
        insight: >
          A transformer forward pass is a pure function of the whole prefix.
          The naive loop makes N tokens at a cost of O(N^2) attention work.
          It computes the K and V of every earlier token at every step.
        deliver: "generate() that emits one token at a time from a HF model."
        measure: "tokens/sec at 128 output tokens. This is your rock bottom."
        jax_file: "app/j01_naive.py"
        jax_insight: >
          The same quadratic recompute, and you also feel the OTHER cost at
          once. Each new prompt length is a new shape. Each new shape is an
          XLA compile. The naive loop in JAX is slow two times over, and the
          algorithm causes only one of the two.
        jax_deliver: "naive_generate() over jvllm's Qwen3, no cache, one token at a time."

      - id: "02-kv-cache"
        file: "app/s02_cache.py"
        name: "The KV cache"
        difficulty: 2
        insight: >
          The K and V of a token never change after you compute them. Cache
          them, and each decode step becomes a forward pass over one token.
          The total cost is O(N). Memory now becomes your enemy, not compute.
        deliver: "A contiguous KV cache for each sequence. Decode attends over the cache and the new token."
        measure: "tokens/sec (expect a large multiple of stage 1) and bytes of KV per token."
        jax_file: "app/j02_cache.py"
        jax_insight: >
          torch gives you a cache that grows by concatenation. XLA compiles
          for exact shapes, so a cache that grows costs one recompile for each
          token. So you PREALLOCATE the JAX cache to max_len and write into it
          with a dynamic slice. The shapes never change, and one compile serves
          the whole decode. You now own the bookkeeping that torch did for you.
        jax_deliver: "Preallocated (layers, B, max_len, kv_heads, head_dim) cache, written at cache_len."

      - id: "03-roofline"
        file: "app/s03_roofline.py"
        name: "Prefill vs decode: two different machines"
        difficulty: 2
        insight: >
          Prefill waits on compute. It runs big GEMMs at a high arithmetic
          intensity. Decode waits on memory bandwidth. At batch size 1 the GPU
          reads every weight from HBM to make one token. The two want opposite
          optimizations. This is THE fact behind every later design decision.
        deliver: "A microbenchmark separating prefill ms/token from decode ms/token."
        measure: "Achieved GB/s during decode vs your GPU's peak. You get near the peak."
        jax_file: "app/j03_roofline.py"
        jax_insight: >
          The same roofline, with one new trap. JAX dispatch is ASYNCHRONOUS.
          A timing loop with no block_until_ready() measures how fast Python
          enqueues work. On a small model that looks like a 50x speedup, and
          the speedup is not there. Warm up separately, or you time the XLA
          compiler.
        jax_deliver: "Prefill vs decode ms/token, with compile excluded and the device actually waited on."

  - id: A1
    name: "Batching"
    blurb: "Decode is bandwidth-bound, so extra sequences are nearly free. Exploit that."
    stages:
      - id: "04-static-batching"
        file: "app/s04_static_batch.py"
        name: "Static batching with padding"
        difficulty: 2
        insight: >
          A batch spreads the weight read across the sequences. You get 8x the
          tokens for almost 1x the time. But a static batch runs until its
          SLOWEST member finishes. A short sequence then sits padded and idle,
          and it wastes the slot.
        deliver: "Left-padded batch of N prompts, shared decode loop, attention mask."
        measure: "Throughput vs batch size, AND the % of decoded token-slots wasted on padding."
        jax_file: "app/j04_static_batch.py"
        jax_insight: >
          torch pads on the left, so the last index holds the last real token
          of every row. With a cache that you write into, you pad on the RIGHT.
          The prompt of each row starts at slot 0, and you read the logits from
          an index for each row. The padding still wastes the same compute.
          That part is not a layout problem. It is the batch shape itself.
        jax_deliver: "Right-padded batch, per-row cache_len and logits_index, shared decode loop."

      - id: "05-continuous-batching"
        file: "app/s05_continuous.py"
        name: "Continuous batching (iteration-level scheduling)"
        difficulty: 3
        insight: >
          Schedule for each ITERATION, and not for each request. When a
          sequence emits EOS, remove it in that same step and admit a waiting
          sequence into its slot. The idea comes from Orca (OSDI '22). On real
          traffic it gives 2x to 4x over a static batch. It is the largest
          throughput win in this repo.
        deliver: "A step() loop over a mutable running set. A request joins or leaves in mid-flight."
        measure: "Throughput on a Poisson arrival trace + p50/p99 latency vs stage 4."
        jax_file: "app/j05_continuous.py"
        jax_insight: >
          Eviction is where the two tracks separate. torch indexes the cache
          tensor again and gets a new shape. You cannot do that, because the
          shape is the compilation. So the SLOT of a finished row serves a new
          sequence in place. Each row of the fixed batch dimension then holds a
          sequence, or it is free. That is half of the block allocator in
          stage 06.
        jax_deliver: "Fixed-width slot table, admit into a free slot, evict by marking free."

  - id: A2
    name: "PagedAttention"
    blurb: "The idea behind the name vLLM. Virtual memory, applied to the KV cache."
    stages:
      - id: "06-block-allocator"
        file: "app/s06_blocks.py"
        name: "Blocks, block tables, free list"
        difficulty: 3
        insight: >
          A contiguous cache for each sequence forces you to allocate for
          max_len. So a real server wastes 60% to 80% of its KV memory on
          internal fragmentation and reservation. Cut the cache into fixed
          16-token blocks. Hand them out on demand. Keep one block table, which
          is a page table, for each sequence. The waste falls to less than one
          block for each sequence.
        deliver: "BlockAllocator + BlockTable. No attention changes yet."
        measure: "Sequences resident in 12GB, paged vs contiguous. Expect a big jump."

      - id: "07-paged-attention"
        file: "app/s07_paged_attn.py"
        name: "Attention that reads through the page table"
        difficulty: 4
        insight: >
          The kernel must gather K and V from scattered blocks. It can no
          longer stride through a contiguous tensor. Do it in PyTorch first,
          with index_select and SDPA, to make it CORRECT. Then keep that
          version as the reference oracle forever.
        deliver: "paged_attn() in pure PyTorch, bit-comparable to stage 2's output."
        measure: "Correctness vs the contiguous implementation, then the slowdown you just ate."
        jax_file: "app/j07_paged_attn.py"
        jax_insight: >
          There is no Python loop over the sequences this time. jnp.take on
          the block table gathers the blocks of every sequence at one time, and
          vmap handles the batch. This is still the slow reference version,
          because it materialises all of the gathered K and V. It is the
          oracle.
        jax_deliver: "paged_attention() in jnp. Gather by block table, then mask, then softmax."

      - id: "08-paged-attention-cuda"
        file: "app/s08_paged_cuda.py"
        files: ["app/cuda/s08_paged_attn.cu", "app/s08_paged_cuda.py"]
        name: "The same thing, in CUDA"
        difficulty: 5
        insight: >
          Give one block to each (sequence, query head) pair. Walk the block
          table. Stream the K and V tiles, and fold them into a running
          softmax, so that the score row never reaches HBM. The decision that
          matters is not the arithmetic. It is what one block owns, because
          that fixes everything else. A block that owns one output vector
          never needs to talk to another block.
        deliver: "A CUDA paged decode kernel, plus the KV scatter kernel, that beats stage 07."
        measure: "Correctness against stage 07, then us/token, then the fraction of this card's bandwidth that you reached."
        jax_file: "app/j08_paged_pallas.py"
        jax_name: "The same thing, fast (Pallas)"
        jax_insight: >
          Pallas is the same idea as Triton with a different surface. You get
          Refs and BlockSpecs in the place of raw pointers and strides, and an
          index_map chooses the tile that each program sees. The online softmax
          is the same. One thing changes: the block table lookup must happen
          INSIDE the kernel. So you read the cache with a computed index, and a
          BlockSpec does not do it for you.
        jax_deliver: "A Pallas paged decode kernel that beats the jnp version."

      - id: "08b-cuda-memory"
        tracks: ["torch"]
        file: "app/s08b_cuda_memory.py"
        files: ["app/cuda/s08b_paged_attn_vec.cu", "app/s08b_cuda_memory.py"]
        name: "How to feed the memory system"
        difficulty: 4
        insight: >
          Your stage 08 kernel gave one thread to one position, and each
          thread walked head_dim alone. So the 32 threads of a warp asked for
          32 scattered rows at one time. Turn the mapping sideways. The threads
          then cooperate ALONG head_dim, at 16 bytes each, and the requests of
          the warp merge into whole 128-byte transactions. The arithmetic and
          the answers do not change, and the bandwidth approximately doubles.
          This is the most valuable habit in CUDA.
        deliver: "The same kernel with coalesced, 128-bit vectorized loads and the accumulator in registers."
        measure: "At least 1.5x over stage 08, and a real fraction of this card's measured streaming bandwidth."

      - id: "08c-cuda-warps"
        tracks: ["torch"]
        file: "app/s08c_cuda_warps.py"
        files: ["app/cuda/s08c_paged_attn_split.cu", "app/s08c_cuda_warps.py"]
        name: "Warps, occupancy and split-K"
        difficulty: 5
        insight: >
          At batch 1 the grid is (1, num_heads), and most of the SMs have
          nothing to do. So a kernel that is perfect on bandwidth still uses a
          few percent of the card. There are two fixes. Use __shfl_xor_sync to
          reduce inside a warp, with no shared memory and no barrier. Then use
          split-K, which cuts the CONTEXT into chunks to make more blocks and
          merges the partial softmax states exactly. Batch 1 is every
          interactive request.
        deliver: "Warp-shuffle reductions, then a split-K kernel and an exact merge pass."
        measure: "At least 1.5x over stage 08b at 1, 2 and 4 sequences, and no more than a few percent given back at 64."

      - id: "09-prefix-sharing"
        file: "app/s09_prefix.py"
        name: "Copy-on-write and automatic prefix caching"
        difficulty: 4
        insight: >
          A block table makes sharing simple. Two sequences can point at the
          same physical block. Count the references, and copy a block when one
          sequence diverges. Then hash the contents of a block and share it
          across REQUESTS. One prefill of a shared system prompt then serves
          everybody. This is why APC looks like cheating.
        deliver: "Refcounted blocks, CoW on write, content-hash prefix cache with LRU eviction."
        measure: "Blocks shared and prefill work saved for a shared system prompt. Stage 22 measures it on a real model."

  - id: A3
    name: "The Scheduler"
    blurb: "You have finite KV memory and infinite requests. Decide who runs."
    stages:
      - id: "10-admission-preemption"
        file: "app/s10_scheduler.py"
        name: "Waiting / running / swapped, and preemption"
        difficulty: 4
        insight: >
          Sequences grow one block at a time, so the batch you admitted can run
          out of memory mid-decode. You need preemption: either SWAP blocks to
          CPU or DROP them and recompute later. Recompute usually wins, because
          prefill is fast and PCIe is not.
        deliver: "Three queues, a KV budget check per step, preempt-by-recompute."
        measure: "Behavior under overload: does throughput degrade gracefully or collapse?"

      - id: "11-chunked-prefill"
        file: "app/s11_chunked.py"
        name: "Chunked prefill and mixed batches"
        difficulty: 4
        insight: >
          One 8000-token prefill stalls every decoding sequence for a whole step,
          wrecking inter-token latency for everyone. Split prefill into chunks and
          co-schedule chunks with decodes in the SAME batch. From Sarathi-Serve.
          This is the throughput/latency dial in every modern serving stack.
        deliver: "A unified batch of [prefill chunks + decode tokens] with correct positions."
        measure: "p99 inter-token latency with a long prompt in flight. Before vs after."

  - id: A4
    name: "How To Make It Fast"
    blurb: "Everything left is overhead removal."
    stages:
      - id: "12-cuda-graphs"
        file: "app/s12_cudagraph.py"
        name: "CUDA graphs for the decode step"
        difficulty: 4
        insight: >
          At batch 1 a decode step is approximately 1 ms of GPU work. Python
          and the kernel launches can cost another 1 ms. Capture the whole step
          as a graph, and replay it. A graph needs static shapes, so capture at
          bucketed batch sizes and pad up to the nearest bucket.
        deliver: "Graph capture per bucket, replay path, eager fallback."
        measure: "us/step at batch 1, 2, 4, 8. Watch the Python tax vanish."
        jax_file: "app/j12_compiled.py"
        jax_name: "Shape buckets, to stop the recompiles"
        jax_insight: >
          JAX has no launch overhead to remove. XLA already fused the step
          into one graph. Its equivalent tax is RECOMPILATION. Each new batch
          size traces and compiles again, at seconds each, on the critical
          path. The fix is the same as a CUDA graph, for a different reason.
          Pad to bucketed shapes, so that the compilation cache hits, and
          donate the buffers, so that the engine writes the cache in place.
        jax_deliver: "Bucketed AOT compile + donate_argnums, with a compile counter proving cache hits."

      - id: "13-sampling"
        file: "app/s13_sampler.py"
        name: "A real batched sampler"
        difficulty: 3
        insight: >
          Each request has its own temperature, top-k, top-p, penalties and
          seed. ONE vectorized pass over the batch must apply all of them. When
          the kernels become fast, a Python loop over the requests quietly
          becomes your bottleneck.
        deliver: "Vectorized temp/top-k/top-p/repetition penalty, per-request seeded RNG."
        measure: "Sampler ms/step at batch 64, plus a distributional test that top-p is exact."
        jax_file: "app/j13_sampler.py"
        jax_insight: >
          JAX has no global RNG, and that is the correct shape for a server. A
          per-request seed is a PRNG key for one row. You split it and carry it
          with the request. Gumbel-max then samples the whole batch in one
          vectorized pass, and each row reproduces its own draw.
        jax_deliver: "Vectorized temp/top-k/top-p/penalty, one PRNG key per request."

      - id: "14-detokenization"
        file: "app/s14_detokenizer.py"
        name: "Incremental detokenization and stop conditions"
        difficulty: 3
        insight: >
          You cannot decode tokens one by one. BPE pieces, multi-byte UTF-8 and
          the leading-space rules make a naive stream emit mojibake and double
          spaces. A stop STRING can also cross a token boundary, so you must
          buffer. This stage is dull, and it causes most of the bugs that users
          see in a real server.
        deliver: "Streaming detokenizer with a lookback window + straddling stop-string check."
        measure: "Fuzz test: streamed output must equal batch-decoded output, always."

  - id: A5
    name: "The Server"
    blurb: "Turn the engine into something you can curl."
    stages:
      - id: "15-async-engine"
        file: "app/s15_server.py"
        name: "Async engine + OpenAI-compatible API"
        difficulty: 3
        insight: >
          The engine loop must never block on HTTP, and HTTP must never block
          on the GPU. One process runs step() forever. Requests reach it as
          futures and queues. Real vLLM V1 goes further and uses a separate
          EngineCore process, so that Python overhead on the API side cannot
          stall the GPU.
        deliver: "/v1/completions with SSE streaming and cancellation, around an engine that you inject."
        measure: "Streams interleave, and a disconnect calls abort. Stage 27 connects the real engine."

      - id: "16-observability"
        file: "app/s16_metrics.py"
        name: "The metrics that matter"
        difficulty: 2
        insight: >
          Export TTFT, TPOT and ITL, throughput, queue wait, KV utilization
          and the preemption rate. Without the KV utilization and the
          preemption count you can tune nothing, and you diagnose every
          performance problem incorrectly.
        deliver: "Prometheus-style metrics + a load generator with a Poisson arrival trace."
        measure: "A throughput/latency Pareto curve as you sweep max_num_seqs."

  - id: A6
    name: "Modern vLLM"
    blurb: "Optional, but this is where the field currently is."
    stages:
      - id: "17-speculative-decoding"
        file: "app/s17_speculative.py"
        name: "Draft, verify, reject"
        difficulty: 5
        insight: >
          Decode waits on bandwidth, so a check on K tokens costs about as
          much as one new token. Propose K tokens with something cheap, such as
          an n-gram lookup or a very small model. Check them in one pass, and
          accept the longest correct prefix. Modified rejection sampling keeps
          the output distribution EXACTLY the same.
        deliver: "N-gram speculator + rejection sampler + acceptance-rate telemetry."
        measure: "Speedup against acceptance rate. Prove that the output distribution does not move."

      - id: "18-quantization"
        file: "app/s18_quantization.py"
        name: "Weight-only quantization"
        difficulty: 4
        insight: >
          Decode reads every weight for every token. So half the weight bytes
          gives almost half the decode time. Use INT8 or FP8 on the weights
          only, with a scale for each channel, and dequantize in the kernel
          epilogue. Quantize the KV cache too. It is the other big reader.
        deliver: "INT8 weight-only linear + FP8 KV cache, with a perplexity guard."
        measure: "tokens/sec and VRAM vs perplexity delta on a fixed text sample."
        jax_file: "app/j18_quantization.py"
        jax_insight: >
          The arithmetic is the same. But the model is a pytree, and not a
          module tree. So you quantize it with a tree_map, and not with a walk
          over named_modules. Watch that the dequantize stays FUSED into the
          matmul. If XLA materialises the bf16 weight first, you added a
          full-size write and a full-size read, and decode became slower.
        jax_deliver: "int8 per-channel and fp8 e4m3 over the params pytree, with a perplexity guard."

      - id: "18b-int8-gemv-cuda"
        tracks: ["torch"]
        file: "app/s18b_gemv_cuda.py"
        files: ["app/cuda/s18b_gemv_int8.cu", "app/s18b_gemv_cuda.py"]
        name: "The dequantize belongs in the epilogue"
        difficulty: 4
        insight: >
          Stage 18 made the weight bytes half as many, and then gave the
          multiply to PyTorch. PyTorch builds a bf16 copy of the weight before
          it can use it. Time that honestly, and the quantization is a LOSS.
          Weight-only quantization pays only when the kernel applies the scale
          at the end of the dot product, to a register value. Then measure against cuBLAS, and find the batch size where
          your kernel stops to win. That number is the boundary between decode
          and prefill, in milliseconds.
        deliver: "An int8 GEMV with a fused dequantize epilogue, and a Linear that dispatches on batch size."
        measure: "At least 3x over dequantize-then-matmul, at least 1.5x over bf16 cuBLAS at one row, and the crossover where that stops."

      - id: "19-guided-decoding"
        file: "app/s19_guided.py"
        name: "Constrained output via logit masking"
        difficulty: 4
        insight: >
          Compile a grammar or a JSON schema to an FSM over token ids. Mask
          the illegal logits at each step. Two parts are hard: the tokenizer
          alignment, and the mask build. Keep the mask build off the critical
          path, so that it does not stall the GPU.
        deliver: "JSON-schema-constrained sampling with a precomputed token mask cache."
        measure: "100% schema-valid outputs, and the ms/step the mask costs you."

      - id: "20-tensor-parallel"
        file: "app/s20_tensor_parallel.py"
        name: "Tensor parallelism (simulated on one GPU)"
        difficulty: 5
        insight: >
          Shard the attention heads and the MLP columns across the ranks, with
          one all-reduce for each layer. You have one GPU, so run 2 gloo ranks
          on the CPU, and make the collectives and the sharding logic correct.
          The lesson is where the communication lands. It is not the speedup.
        deliver: "Column/row-parallel Linear, 2-rank sharded model, output matches 1-rank."
        measure: "Correctness first. Then all-reduce bytes per token per layer."
        jax_file: "app/j20_tensor_parallel.py"
        jax_insight: >
          JAX makes this stage honest. shard_map gives you real devices, real
          shardings and a real psum. It is not a Python loop that imitates the
          ranks. You write column-parallel, then row-parallel, with exactly one
          psum between blocks. It is a mesh and two PartitionSpecs.
        jax_deliver: "shard_map MLP and attention over a multi-device CPU mesh, one psum per block."

  - id: A7
    name: "The Capstone: One Engine"
    blurb: "Every part you built, in one server, measured against the roof."
    stages:
      - id: "21-paged-model"
        tracks: ["torch"]
        file: "app/s21_paged_runner.py"
        name: "The model runs on your paged cache"
        difficulty: 4
        insight: >
          Stages 06 to 08c passed their checks on random tensors, and none of
          them ran inside a model. The HF model cannot host them, because its
          cache grows by concatenation. tvllm/model.py takes a flat batch and
          calls your attention backend. Your backend writes K and V with your
          stage 08 kernel and reads them with your stage 08c kernel. Put the
          decodes first, so that one launch serves them all.
        deliver: "A ModelRunner that runs a mixed batch of decodes and prefill chunks on the paged cache."
        measure: "Tokens identical to HF in fp32, for ragged batches, shuffled blocks and chunked prefill."

      - id: "22-engine"
        tracks: ["torch"]
        file: "app/s22_engine.py"
        name: "One engine from the parts"
        difficulty: 5
        insight: >
          Stages 10 and 11 were two schedulers in a simulation. Here they
          become one rule. Each sequence has pending tokens: one for a decode,
          many for a prefill, all of them after a preemption. Each step gives
          pending tokens to sequences until the budget runs out. The prefix
          cache, the sampler and the detokenizer attach to that loop.
        deliver: "An LLMEngine with a token budget, preemption by recompute, prefix caching, sampling and stop strings."
        measure: "Tokens identical to HF under preemption and with the prefix cache. No leaked block."

      - id: "23-graphs"
        tracks: ["torch"]
        file: "app/s23_graphs.py"
        name: "The real decode step, captured"
        difficulty: 4
        insight: >
          The eager step at batch 1 costs about two times the weight-read
          time, because it is about a thousand small kernels. Capture the
          decode step for each bucket. A padding row must write to slot -1,
          because a zero slot writes into block 0, and block 0 belongs to a
          real sequence.
        deliver: "A GraphedModelRunner that replays a captured decode step and runs everything else eager."
        measure: "At least 1.2x over eager at batch 1, and at least 50% of the weight-read floor."

      - id: "24-quantized"
        tracks: ["torch"]
        file: "app/s24_quantized.py"
        name: "Quantized weights in the engine"
        difficulty: 3
        insight: >
          Your stage 18b GEMV reads half the bytes of bf16, and it wins at a
          few rows. Above a crossover, cuBLAS in bf16 wins, because the rows
          share the weight read. So each matmul dispatches on its row count.
          Measure the crossover in the real graphed step, not on one matrix:
          one matrix of a small model fits in L2, and the result is wrong.
        deliver: "Int8 weights in every matmul, with a dispatch to bf16 above a measured crossover."
        measure: "At least 1.3x at batch 1, no loss at batch 32, perplexity within 3%."

      - id: "24b-fp8-kv-cache"
        tracks: ["torch"]
        file: "app/s24b_kv_fp8.py"
        files: ["app/cuda/s24b_kv_fp8.cu", "app/s24b_kv_fp8.py"]
        name: "The KV cache in FP8"
        difficulty: 5
        insight: >
          At long context the KV cache, not the weights, is most of the bytes
          of a step. Store it in FP8. Your stage 08c kernel reads it with
          16-byte loads, converts two values with one instruction, and folds
          the key scale into the query and the value scale into the output.
          Half the bytes to read, and twice the tokens in the pool.
        deliver: "FP8 write and attention kernels, calibrated scales, and an FP8 runner."
        measure: "At least 1.2x at 16 x 2048 tokens, perplexity through the decode kernel within 3%."

      - id: "25-speculative"
        tracks: ["torch"]
        file: "app/s25_speculative.py"
        name: "Speculative decoding inside the engine"
        difficulty: 4
        insight: >
          A verify of K draft tokens is K+1 decode rows that share one block
          table. Each row sees its own context, so the verify is causal, runs
          on your stage 08c kernel, and replays a captured graph. Greedy
          accepts while the draft matches the argmax. Sampling uses the
          stage 17 rule with a one-hot draft, so the output does not move.
        deliver: "A SpeculativeEngine with n-gram drafts and an exact verify."
        measure: "Greedy output identical in fp32, the target distribution kept, at least 1.5x on a copy task."

      - id: "26-guided"
        tracks: ["torch"]
        file: "app/s26_guided.py"
        name: "Guided JSON decoding inside the engine"
        difficulty: 5
        insight: >
          Stage 19 validated the whole text again for every token, and its
          cache never hit. A real engine walks a character automaton, and it
          caches the masks by automaton state: a whole JSON answer needs a
          few dozen states. Near max_tokens, admit only the tokens that bring
          the object closer to complete, or the answer ends open.
        deliver: "A JSON automaton, masks cached by state, a forced close, and a GuidedEngine."
        measure: "Every answer parses. The automaton agrees with json. A second round builds almost no mask."

      - id: "27-serve"
        tracks: ["torch"]
        file: "app/s27_serve.py"
        name: "The server, for real"
        difficulty: 4
        insight: >
          A real step holds the GPU for 5 to 50 ms, and the stage 15 loop runs
          it inside the event loop. Run step() in a worker thread, and send
          add_request and abort to it through a deque. Then speak the API that
          clients send: chat, sampling fields, stop strings, streaming, JSON
          mode, usage and the real finish_reason.
        deliver: "/v1/completions and /v1/chat/completions on your full engine, with /metrics."
        measure: "Chat, JSON mode, streaming and stop strings work. A disconnect frees real blocks. The event loop stays free."

      - id: "28-benchmark"
        tracks: ["torch"]
        file: "app/s28_bench.py"
        name: "Against the roof"
        difficulty: 3
        insight: >
          A throughput number alone says nothing, because it changes from card
          to card. The floor of a step also changes, by the same factor. So
          divide: the floor of the steps that your engine ran, divided by the
          time that they took. That ratio travels between cards, and it tells
          you what remains to win.
        deliver: "A benchmark that measures the engine against the roofline floor of its own steps."
        measure: "At least 30% of the floor, and at least 2x your stage 05 engine on the same requests."
